<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GoWeb Action Cam</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Viewfinder video asli */
        #viewfinder {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Lapisan UI Overlay */
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .interactive {
            pointer-events: auto;
        }

        /* Tombol Rekam */
        .record-btn-container {
            width: 80px;
            height: 80px;
            border: 4px solid white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .record-btn-inner {
            width: 60px;
            height: 60px;
            background-color: #ff3b30;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .is-recording .record-btn-inner {
            width: 30px;
            height: 30px;
            border-radius: 6px;
        }

        .is-recording .record-btn-container {
            border-color: #ff3b30;
        }

        /* Startup screen */
        #startup-screen {
            position: absolute;
            z-index: 50;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }

        /* Widget Panel */
        .glass-panel {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Hide scrollbar for filter menu */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="text-white selection:bg-red-500">

    <!-- Startup / Permission Screen -->
    <div id="startup-screen" class="w-full h-full flex flex-col items-center justify-center interactive p-6 text-center">
        <!-- Logo & Judul -->
        <div class="mb-8 flex flex-col items-center">
            <img src="logo.png" alt="GoWeb Logo" class="w-32 h-32 mb-4 rounded-[2rem] shadow-2xl border border-gray-800">
            <h1 class="text-4xl font-extrabold tracking-tighter mb-2">GoWeb<span class="text-red-500">CAM</span></h1>
            <p class="text-gray-400">Touring Edition - Smooth Action Cam & Telemetry</p>
        </div>
        
        <div class="bg-black/40 p-6 rounded-2xl max-w-md w-full border border-gray-700 shadow-2xl mb-8">
            <h2 class="text-xl font-semibold mb-4 text-left">Fitur Touring:</h2>
            <ul class="text-left text-gray-300 space-y-3 mb-6 text-sm">
                <li class="flex items-center gap-3">
                    <span class="text-blue-400">🚀</span> Perekaman Super Mulus (No Lag)
                </li>
                <li class="flex items-center gap-3">
                    <span class="text-green-400">📍</span> Live GPS Speedometer Akurat
                </li>
                <li class="flex items-center gap-3">
                    <span class="text-yellow-400">💡</span> Anti Layar Mati (Wake Lock Aktif)
                </li>
                <li class="flex items-center gap-3">
                    <span class="text-purple-400">🎨</span> Pilihan Efek Kamera Estetik
                </li>
            </ul>
            <button id="start-app-btn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 px-6 rounded-xl transition-colors text-lg uppercase tracking-wider shadow-lg">
                Mulai Touring
            </button>
        </div>
        <p id="error-message" class="text-red-400 text-sm h-6"></p>
    </div>

    <!-- Video Element Asli (Viewfinder dengan Filter Touring) -->
    <video id="viewfinder" autoplay playsinline muted style="filter: none;"></video>

    <!-- UI Overlay -->
    <div id="ui-layer" class="p-4 hidden">
        
        <!-- Barisan Atas -->
        <div class="flex justify-between items-start w-full">
            
            <!-- Kiri Atas: Branding & Notifikasi Download -->
            <div class="flex flex-col gap-2">
                <div class="glass-panel px-3 py-1 rounded-lg text-sm font-bold opacity-70">
                    GoWeb CAM
                </div>
                
                <div id="download-container" class="hidden interactive glass-panel p-4 rounded-xl mt-2">
                    <p class="text-sm text-green-400 font-bold mb-2">Video Tersimpan!</p>
                    <a id="download-btn" href="#" class="bg-blue-600 hover:bg-blue-500 text-white py-2 px-4 rounded font-semibold text-sm transition-colors block text-center mb-2">
                        Download File
                    </a>
                    <button id="close-download-btn" class="text-xs text-gray-400 underline w-full text-center">Tutup</button>
                </div>
            </div>

            <!-- Kanan Atas: Timer (Hanya muncul saat rekam) -->
            <div id="timer-container" class="hidden glass-panel px-4 py-2 rounded-full flex items-center gap-3">
                <div id="rec-dot" class="w-3 h-3 bg-red-500 rounded-full"></div>
                <span id="timer-text" class="font-mono text-xl font-bold">00:00</span>
            </div>

            <!-- Kanan Atas (Sebelum Rekam): GPS Status -->
            <div id="gps-status" class="glass-panel px-3 py-1 rounded-full text-xs font-mono text-yellow-400 flex items-center gap-2">
                <span class="block w-2 h-2 rounded-full bg-yellow-400"></span> GPS Loading...
            </div>
        </div>

        <!-- Barisan Bawah: Efek Kamera & Tombol Rekam -->
        <div class="flex flex-col items-center justify-end w-full pb-4 gap-4">
            
            <!-- Pilihan Efek Kamera Touring -->
            <div class="interactive flex gap-2 overflow-x-auto w-full px-4 pb-1 justify-center hide-scrollbar">
                <button class="filter-btn active bg-white/30 text-white px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-white/50 shadow-lg whitespace-nowrap" data-filter="none">Normal</button>
                <button class="filter-btn bg-black/50 text-gray-300 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-transparent shadow-lg whitespace-nowrap" data-filter="contrast(130%) saturate(140%) brightness(95%)">Cinematic</button>
                <button class="filter-btn bg-black/50 text-gray-300 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-transparent shadow-lg whitespace-nowrap" data-filter="saturate(180%) contrast(110%)">Vivid Road</button>
                <button class="filter-btn bg-black/50 text-gray-300 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-transparent shadow-lg whitespace-nowrap" data-filter="sepia(40%) contrast(120%) brightness(105%)">Warm Sunset</button>
                <button class="filter-btn bg-black/50 text-gray-300 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-transparent shadow-lg whitespace-nowrap" data-filter="hue-rotate(180deg) saturate(130%)">Cool Blue</button>
                <button class="filter-btn bg-black/50 text-gray-300 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-transparent shadow-lg whitespace-nowrap" data-filter="grayscale(100%) contrast(140%)">Classic B&W</button>
                <button class="filter-btn bg-black/50 text-gray-300 px-3.5 py-1.5 rounded-full text-xs font-semibold backdrop-blur-md border border-transparent shadow-lg whitespace-nowrap" data-filter="contrast(150%) hue-rotate(290deg) saturate(160%)">Cyberpunk</button>
            </div>

            <!-- Baris Bawah Utama: Speedometer & Tombol Record -->
            <div class="flex justify-between items-end w-full">
                <!-- Kiri Bawah: Speedometer -->
                <div class="glass-panel rounded-xl px-4 py-2 flex items-baseline gap-2 min-w-[100px]">
                    <span id="speed-text" class="font-mono text-5xl font-bold">00</span>
                    <span class="text-emerald-500 font-bold text-sm">KM/H</span>
                </div>

                <!-- Tengah Bawah: Tombol Record -->
                <div class="interactive" id="record-wrapper">
                    <div id="record-btn" class="record-btn-container">
                        <div class="record-btn-inner"></div>
                    </div>
                </div>
                
                <!-- Kanan Bawah (Penyimbang Layout) -->
                <div class="w-[100px]"></div>
            </div>

        </div>
    </div>

    <script>
        // DOM Elements
        const startupScreen = document.getElementById('startup-screen');
        const startAppBtn = document.getElementById('start-app-btn');
        const errorMessage = document.getElementById('error-message');
        const uiLayer = document.getElementById('ui-layer');
        const viewfinder = document.getElementById('viewfinder');
        
        const recordBtn = document.getElementById('record-btn');
        const recordWrapper = document.getElementById('record-wrapper');
        const downloadContainer = document.getElementById('download-container');
        const downloadBtn = document.getElementById('download-btn');
        const closeDownloadBtn = document.getElementById('close-download-btn');
        
        const gpsStatus = document.getElementById('gps-status');
        const speedTextEl = document.getElementById('speed-text');
        const timerContainer = document.getElementById('timer-container');
        const timerText = document.getElementById('timer-text');
        const recDot = document.getElementById('rec-dot');
        const filterBtns = document.querySelectorAll('.filter-btn');

        // App State
        let isRecording = false;
        let recordingStartTime = 0;
        let timerInterval;
        let wakeLock = null;
        let mediaRecorder;
        let recordedChunks = [];
        let activeStream;

        // GPS State untuk Kalkulasi Manual
        let lastLat = null;
        let lastLon = null;
        let lastTime = null;

        // Filter Logic untuk Touring
        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                filterBtns.forEach(b => {
                    b.classList.remove('bg-white/35', 'text-white', 'border-white/50');
                    b.classList.add('bg-black/50', 'text-gray-300', 'border-transparent');
                });
                
                const target = e.target;
                target.classList.remove('bg-black/50', 'text-gray-300', 'border-transparent');
                target.classList.add('bg-white/35', 'text-white', 'border-white/50');
                
                const filterValue = target.getAttribute('data-filter');
                viewfinder.style.filter = filterValue;
            });
        });

        // Init Aplikasi
        startAppBtn.addEventListener('click', async () => {
            try {
                startAppBtn.disabled = true;
                startAppBtn.innerHTML = 'Membuka Kamera...';
                
                await initializeCamera();
                initializeGeolocation();
                await requestWakeLock();
                
                startupScreen.style.display = 'none';
                uiLayer.classList.remove('hidden');

            } catch (error) {
                console.error("Error:", error);
                errorMessage.innerText = "Error: " + error.message;
                startAppBtn.disabled = false;
                startAppBtn.innerHTML = 'Coba Lagi';
            }
        });

        // 1. Inisialisasi Kamera dengan Permintaan 60 FPS untuk Stabilisasi Alami
        async function initializeCamera() {
            const constraints = {
                video: {
                    facingMode: "environment",
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                    frameRate: { ideal: 60, min: 30 } // Meminta frame rate tinggi agar tidak patah-patah
                },
                audio: true
            };

            activeStream = await navigator.mediaDevices.getUserMedia(constraints);
            viewfinder.srcObject = activeStream;
            
            return new Promise((resolve) => {
                viewfinder.onloadedmetadata = () => {
                    viewfinder.play();
                    resolve();
                };
            });
        }

        // Fungsi Hitung Jarak Manual (Jika Sensor Speed HP tidak berfungsi)
        function getDistanceFromLatLonInKm(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * (Math.PI / 180);
            const dLon = (lon2 - lon1) * (Math.PI / 180);
            const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                      Math.cos(lat1 * (Math.PI / 180)) * Math.cos(lat2 * (Math.PI / 180)) *
                      Math.sin(dLon / 2) * Math.sin(dLon / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return R * c; 
        }

        // 2. Inisialisasi GPS (Termasuk Perbaikan Fallback Kecepatan)
        function initializeGeolocation() {
            if ("geolocation" in navigator) {
                navigator.geolocation.watchPosition(
                    (position) => {
                        gpsStatus.innerHTML = `<span class="block w-2 h-2 rounded-full bg-green-400"></span> GPS Aktif`;
                        gpsStatus.classList.replace('text-yellow-400', 'text-green-400');

                        const speedMs = position.coords.speed;
                        let kmh = 0;

                        // Jika HP memberikan data kecepatan langsung
                        if (speedMs !== null && speedMs > 0) {
                            kmh = Math.round(speedMs * 3.6);
                        } else {
                            // Sistem Cadangan: Hitung kecepatan manual dari jarak & waktu
                            const currentLat = position.coords.latitude;
                            const currentLon = position.coords.longitude;
                            const currentTime = position.timestamp;

                            if (lastLat !== null && lastTime !== null) {
                                const timeDiffHours = (currentTime - lastTime) / 1000 / 3600; 
                                if (timeDiffHours > 0) {
                                    const distKm = getDistanceFromLatLonInKm(lastLat, lastLon, currentLat, currentLon);
                                    kmh = Math.round(distKm / timeDiffHours);
                                }
                            }
                            lastLat = currentLat;
                            lastLon = currentLon;
                            lastTime = currentTime;
                        }

                        // Mengamankan nilai tidak masuk akal (glitch sinyal awal)
                        if(kmh > 299 || isNaN(kmh)) kmh = 0;

                        speedTextEl.innerText = kmh.toString().padStart(2, '0');
                    },
                    (error) => {
                        gpsStatus.innerHTML = `<span class="block w-2 h-2 rounded-full bg-red-400"></span> GPS Lost`;
                        gpsStatus.classList.replace('text-green-400', 'text-red-400');
                    },
                    { enableHighAccuracy: true, maximumAge: 0, timeout: 5000 }
                );
            }
        }

        // 3. Inisialisasi Wake Lock
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock Aktif');
                }
            } catch (err) {
                console.warn(`Wake Lock gagal: ${err.message}`);
            }
        }
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
        });

        // 4. Logika Perekaman Asli (No Lag)
        recordBtn.addEventListener('click', () => {
            if (!isRecording) startRecording();
            else stopRecording();
        });

        function startRecording() {
            let options = { mimeType: 'video/webm;codecs=vp9,opus', videoBitsPerSecond: 8000000 };
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
                options = { mimeType: 'video/mp4', videoBitsPerSecond: 8000000 };
            }

            try {
                mediaRecorder = new MediaRecorder(activeStream, options);
            } catch (e) {
                mediaRecorder = new MediaRecorder(activeStream); 
            }

            mediaRecorder.ondataavailable = (event) => {
                if (event.data && event.data.size > 0) recordedChunks.push(event.data);
            };
            
            mediaRecorder.onstop = handleStop;
            
            recordedChunks = [];
            mediaRecorder.start(1000);
            
            isRecording = true;
            recordWrapper.classList.add('is-recording');
            downloadContainer.classList.add('hidden');
            gpsStatus.classList.add('hidden');
            timerContainer.classList.remove('hidden');
            
            recordingStartTime = Date.now();
            timerInterval = setInterval(() => {
                const diff = Math.floor((Date.now() - recordingStartTime) / 1000);
                const mins = Math.floor(diff / 60).toString().padStart(2, '0');
                const secs = (diff % 60).toString().padStart(2, '0');
                timerText.innerText = `${mins}:${secs}`;
                recDot.style.opacity = (diff % 2 === 0) ? '1' : '0.2';
            }, 1000);
        }

        function stopRecording() {
            mediaRecorder.stop();
            isRecording = false;
            
            recordWrapper.classList.remove('is-recording');
            clearInterval(timerInterval);
            timerContainer.classList.add('hidden');
            gpsStatus.classList.remove('hidden');
        }

        function handleStop() {
            const mimeType = recordedChunks[0].type || 'video/mp4';
            const blob = new Blob(recordedChunks, { type: mimeType });
            const url = window.URL.createObjectURL(blob);
            
            const date = new Date();
            const timestamp = `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate()}_${date.getHours()}${date.getMinutes()}`;
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            
            downloadBtn.href = url;
            downloadBtn.download = `GoWebCam_Touring_${timestamp}.${ext}`;
            downloadContainer.classList.remove('hidden');

            setTimeout(() => downloadBtn.click(), 500);
        }

        closeDownloadBtn.addEventListener('click', () => {
            downloadContainer.classList.add('hidden');
        });

    </script>
</body>
</html>
